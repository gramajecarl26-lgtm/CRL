   <h2>Student Registration Form</h2>
    Full name:  <input type="text" placeholder="Enter your name" /><br>
    <br>
    Password:  <input type="password" placeholder="Enter your password" /><br>
    <br>
    Email:  <input type="email" placeholder="Enter your email" /><br>
    <br>
    Age:  <input type="number" placeholder="Enter your Age" /><br>
    <br>

    <form>
    <button>Input</button>
    <button>Reset</button>
    <br><br>
    </form>

    <form>
    Status<br>
    <input type="radio" name="status" value="single"> Single
    <input type="radio" name="status" value="married"> Married
    <br><br>
    </form>

    <form>
    Subject<br>
    <select name="dropdown">
    <option value="Maths"selected>Maths</option>> 
    <option value="Physics">Physics</option>>
    <br><br>
    </form>
    <form>
    <input type="checkbox" name="java" value="on"> Java
    <input type="checkbox" name="html" value="on"> Html
    <input type="checkbox" name="c++" value="on"> C++

    </form>
   
    <form>
    Description : <br />
    <textarea rows="5" cols="50" name="description" placeholder="description" Enter description here...”></textarea>
    </form>
